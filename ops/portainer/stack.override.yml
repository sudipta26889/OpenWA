# Input to generate-stack.sh, layered on docker-compose.yml and docker-compose.override.yml.
# Portainer Git stacks cannot build, so images come from GHCR. Volumes and networks are external so
# a wrong name fails the deploy instead of creating an empty volume (a QR re-scan for every session),
# and so both networks keep their current subnets.
services:
  # Datastores live on db.lan; the built-in profiles must not reach production.
  postgres: !reset null
  redis: !reset null
  minio: !reset null

  openwa-api:
    build: !reset null
    image: ghcr.io/sudipta26889/openwa-api:latest
    environment:
      # Pinned in git, not left to the Portainer Stack Env: OpenWA's Redis ACL user may use DB 0 only, and
      # the cache otherwise selects DB 1 (NOPERM), which shows Redis "Disconnected" on the dashboard.
      - REDIS_CACHE_DB=0
    depends_on: !override
      docker-proxy:
        condition: service_started
        required: false

  mcp-oauth-gateway:
    build: !reset null
    image: ghcr.io/sudipta26889/openwa-mcp-oauth-gateway:latest

  # WhatsApp message -> local model -> hand-off to OpenClaw/Mitra (ops/a2a-router/README.md). Port 8790 is
  # not published. It needs outbound access to LiteLLM and Mitra, so it sits on openwa-network only.
  # dharabot.lan (Mitra's A2A bridge) is resolved by DNS on purpose: owner rule is DNS names, not IPs.
  # Secret files are bind-mounted read-only (mode 600, owned by uid 1000). Live since 2026-11-19 on the owner's goal; Portainer Stack Env ROUTER_MODE=shadow|off overrides it. Was shadow until the owner
  # reviews a week of routes.jsonl; then ROUTER_MODE=live.
  a2a-router:
    build: !reset null
    image: ghcr.io/sudipta26889/openwa-a2a-router:latest
    environment:
      - ROUTER_MODE=${ROUTER_MODE:-live}
      # Peer is OpenClaw/Mitra (design Addendum A). The token file is created later by GuardianAI; the router
      # starts without it in shadow, and in live a missing token is peer_auth_failed.
      - ROUTER_PEER=mitra
      - ROUTER_MITRA_URL=http://dharabot.lan:12345/a2a/v1
      - ROUTER_MITRA_TOKEN_FILE=/secrets/mitra-token
      # Mitra's own WhatsApp lid: its pings to the owner must never loop back into the router.
      - ROUTER_IGNORE_SENDERS=281389312278744@lid
      # Pings name the WhatsApp number instead of the session UUID.
      - 'ROUTER_SESSION_NAMES={"0face0b6-25d2-4621-833d-6a6ed1598b0a":"personal-wa","4a6a3c02-5adb-4e07-9355-afc874ed45cd":"business-wa"}'
      # Same LAN LiteLLM TaskPilot uses; Flint only (the router refuses any other model).
      - ROUTER_LLM_BASE_URL=http://db.lan:4000/v1
    # Pinned like openwa-api: a DNS failure must not cut the router off from LiteLLM.
    extra_hosts:
      - "db.lan:192.168.10.120"
    volumes:
      - a2a-router-data:/data
      - /opt/openwa/a2a-router-secrets:/secrets:ro

  # Self-heals the message stream after a WhatsApp Web reload (see ops/watchdog/watchdog.sh). No docker
  # socket: logs come through docker-proxy, restarts over HTTP with an operator-role key.
  openwa-watchdog:
    image: ghcr.io/sudipta26889/openwa-watchdog:latest
    container_name: openwa-watchdog
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - openwa-network
      - internal-docker
    volumes:
      - openwa-watchdog-state:/state
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - WATCHDOG_API_KEY=${WATCHDOG_API_KEY:-}
      - OPENWA_CONTAINER=openwa-api
      - WATCHDOG_POLL_SECONDS=60
      # 0 disables the blind refresh: since v0.22.0 the engine's eventsAttached guard replaces it.
      - WATCHDOG_BACKSTOP_SECONDS=0
      - WATCHDOG_DEBOUNCE_SECONDS=180

volumes:
  postgres-data: !reset null
  redis-data: !reset null
  minio-data: !reset null
  openwa-data:
    name: openwa_openwa-data
    external: true
    driver: !reset null
  mcp-oauth-gateway-data:
    name: openwa_mcp-oauth-gateway-data
    external: true
  a2a-router-data:
    name: openwa_a2a-router-data
    external: true
  openwa-watchdog-state:
    name: watchdog_openwa-watchdog-state
    external: true

networks:
  openwa-network:
    name: openwa-network
    external: true
  internal-docker:
    name: openwa-internal-docker
    external: true
    internal: !reset null
