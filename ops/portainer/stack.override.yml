# Input to generate-stack.sh, layered on docker-compose.yml and docker-compose.override.yml.
# Portainer Git stacks cannot build, so images come from GHCR. Volumes and networks are external so
# a wrong name fails the deploy instead of creating an empty volume (a QR re-scan for every session),
# and so both networks keep their current subnets.
services:
  # Datastores live on db.lan; the built-in profiles must not reach production.
  postgres: !reset null
  redis: !reset null
  minio: !reset null

  openwa-api:
    build: !reset null
    image: ghcr.io/sudipta26889/openwa-api:latest
    environment:
      # Pinned in git, not left to the Portainer Stack Env: OpenWA's Redis ACL user may use DB 0 only, and
      # the cache otherwise selects DB 1 (NOPERM), which shows Redis "Disconnected" on the dashboard.
      - REDIS_CACHE_DB=0
    depends_on: !override
      docker-proxy:
        condition: service_started
        required: false

  mcp-oauth-gateway:
    build: !reset null
    image: ghcr.io/sudipta26889/openwa-mcp-oauth-gateway:latest

  # WhatsApp message -> local model -> task proposal to TaskPilot (ops/a2a-router/README.md). Port 8790 is
  # not published. It needs outbound access to LiteLLM and TaskPilot, so it sits on openwa-network only.
  # Secret files are bind-mounted read-only (mode 600, owned by uid 1000). Stays in shadow until the owner
  # reviews a week of routes.jsonl; then ROUTER_MODE=live.
  a2a-router:
    build: !reset null
    image: ghcr.io/sudipta26889/openwa-a2a-router:latest
    environment:
      - ROUTER_MODE=shadow
      - ROUTER_LLM_BASE_URL=${ROUTER_LLM_BASE_URL:?ROUTER_LLM_BASE_URL is required}
    volumes:
      - a2a-router-data:/data
      - /opt/openwa/a2a-router-secrets:/secrets:ro

  # Self-heals the message stream after a WhatsApp Web reload (see ops/watchdog/watchdog.sh). No docker
  # socket: logs come through docker-proxy, restarts over HTTP with an operator-role key.
  openwa-watchdog:
    image: ghcr.io/sudipta26889/openwa-watchdog:latest
    container_name: openwa-watchdog
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - openwa-network
      - internal-docker
    volumes:
      - openwa-watchdog-state:/state
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - WATCHDOG_API_KEY=${WATCHDOG_API_KEY:-}
      - OPENWA_CONTAINER=openwa-api
      - WATCHDOG_POLL_SECONDS=60
      # 0 disables the blind refresh: since v0.22.0 the engine's eventsAttached guard replaces it.
      - WATCHDOG_BACKSTOP_SECONDS=0
      - WATCHDOG_DEBOUNCE_SECONDS=180

volumes:
  postgres-data: !reset null
  redis-data: !reset null
  minio-data: !reset null
  openwa-data:
    name: openwa_openwa-data
    external: true
    driver: !reset null
  mcp-oauth-gateway-data:
    name: openwa_mcp-oauth-gateway-data
    external: true
  a2a-router-data:
    name: openwa_a2a-router-data
    external: true
  openwa-watchdog-state:
    name: watchdog_openwa-watchdog-state
    external: true

networks:
  openwa-network:
    name: openwa-network
    external: true
  internal-docker:
    name: openwa-internal-docker
    external: true
    internal: !reset null
