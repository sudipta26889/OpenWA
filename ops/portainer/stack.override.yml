# Input to generate-stack.sh, layered on docker-compose.yml and docker-compose.override.yml.
# Portainer Git stacks cannot build, so images come from GHCR. Volumes and networks are external so
# a wrong name fails the deploy instead of creating an empty volume (a QR re-scan for every session),
# and so both networks keep their current subnets.
services:
  # Datastores live on db.lan; the built-in profiles must not reach production.
  postgres: !reset null
  redis: !reset null
  minio: !reset null

  openwa-api:
    build: !reset null
    image: ghcr.io/sudipta26889/openwa-api:latest
    depends_on: !override
      docker-proxy:
        condition: service_started
        required: false

  mcp-oauth-gateway:
    build: !reset null
    image: ghcr.io/sudipta26889/openwa-mcp-oauth-gateway:latest

  # Self-heals the message stream after a WhatsApp Web reload (see ops/watchdog/watchdog.sh). Its only
  # credential path is `docker exec` into openwa-api, so it holds no secret.
  openwa-watchdog:
    image: ghcr.io/sudipta26889/openwa-watchdog:latest
    container_name: openwa-watchdog
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openwa-watchdog-state:/state
    environment:
      - OPENWA_CONTAINER=openwa-api
      - WATCHDOG_POLL_SECONDS=60
      # 0 disables the blind refresh: since v0.22.0 the engine's eventsAttached guard replaces it.
      - WATCHDOG_BACKSTOP_SECONDS=0
      - WATCHDOG_DEBOUNCE_SECONDS=180

volumes:
  postgres-data: !reset null
  redis-data: !reset null
  minio-data: !reset null
  openwa-data:
    name: openwa_openwa-data
    external: true
    driver: !reset null
  mcp-oauth-gateway-data:
    name: openwa_mcp-oauth-gateway-data
    external: true
  openwa-watchdog-state:
    name: watchdog_openwa-watchdog-state
    external: true

networks:
  openwa-network:
    name: openwa-network
    external: true
  internal-docker:
    name: openwa-internal-docker
    external: true
    internal: !reset null
