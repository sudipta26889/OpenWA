# Homelab override — passes vars the base compose does not forward, and puts the MCP OAuth gateway in
# front of the API on the LAN port. Secrets are interpolated from .env (not hardcoded here).
# All homelab customisation lives here and under ops/, so upstream merges never conflict in src/.
services:
  openwa-api:
    # The gateway owns the published port; the API stays reachable on loopback for local debugging.
    ports: !override
      - "127.0.0.1:2786:2785"
    # db.lan (Postgres + Redis, moved off nuc.lan on 2026-10-19) pinned: a DNS failure on 2026-09-21
    # left the API unable to reach Redis, then the stack was stopped and stayed down (502) for a week.
    extra_hosts:
      - "db.lan:192.168.10.120"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - AUTO_START_SESSIONS=${AUTO_START_SESSIONS:-true}
      - MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-10}
      - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
      - WEBHOOK_SSRF_PROTECT=${WEBHOOK_SSRF_PROTECT:-false}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-true}
      - CSP_UPGRADE_INSECURE_REQUESTS=false
      - MCP_ENABLED=${MCP_ENABLED:-false}
      - MCP_READONLY=${MCP_READONLY:-true}
      # Every request now arrives from the gateway, which appends the real client to X-Forwarded-For.
      # Trusting openwa-network keeps per-IP rate limits and IP allowlists on the real client.
      # In production the stack Env also lists the public reverse proxy, the hop before the gateway.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-10.201.6.0/24}

  # OAuth 2.1 for /mcp, outside the OpenWA source tree (ops/mcp-oauth-gateway/README.md).
  mcp-oauth-gateway:
    build: ./ops/mcp-oauth-gateway
    image: openwa-mcp-oauth-gateway
    container_name: openwa-mcp-oauth-gateway
    restart: unless-stopped
    depends_on:
      - openwa-api
    ports:
      - "0.0.0.0:${API_PORT:-2785}:2785"
    environment:
      - OAUTH_ISSUER=${OAUTH_ISSUER:?OAUTH_ISSUER must be the public https origin}
      - UPSTREAM_URL=http://openwa-api:2785
    volumes:
      - mcp-oauth-gateway-data:/data
    networks:
      - openwa-network
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    mem_limit: 128m

  # Reads webhook messages, asks the local model whether the owner must act, proposes a task to TaskPilot
  # (ops/a2a-router/README.md). Starts in shadow mode: classifies and logs, never calls the peer.
  # Secret files (webhook-secret, llm-key, taskpilot-token, mode 600, readable by uid 1000) live in
  # A2A_ROUTER_SECRETS_DIR.
  a2a-router:
    build: ./ops/a2a-router
    image: openwa-a2a-router
    container_name: openwa-a2a-router
    restart: unless-stopped
    environment:
      - ROUTER_MODE=${ROUTER_MODE:-shadow}
      - ROUTER_LLM_BASE_URL=${ROUTER_LLM_BASE_URL:-}
      - ROUTER_MODEL=recursivesi/flint
      - ROUTER_PEER=mitra
      - ROUTER_MITRA_URL=http://dharabot.lan:12345/a2a/v1
      - ROUTER_MITRA_TOKEN_FILE=/secrets/mitra-token
      - ROUTER_WEBHOOK_SECRET_FILE=/secrets/webhook-secret
      - ROUTER_LLM_KEY_FILE=/secrets/llm-key
    volumes:
      - a2a-router-data:/data
      - ${A2A_ROUTER_SECRETS_DIR:-./ops/a2a-router/.secrets}:/secrets:ro
    networks:
      - openwa-network
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    mem_limit: 128m

volumes:
  mcp-oauth-gateway-data:
  a2a-router-data:
